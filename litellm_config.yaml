# Optional LiteLLM gateway (docker compose service `litellm`).
# Super Jarvis does not need this — it talks to SpaceXAI directly.
model_list:
  - model_name: grok-4.6
    litellm_params:
      model: openai/grok-4.6
      api_base: https://api.x.ai/v1
      api_key: os.environ/XAI_API_KEY
  - model_name: kimi-k3
    litellm_params:
      model: openai/kimi-k3
      api_base: os.environ/KIMI_K3_BASE_URL
      api_key: os.environ/LITELLM_MASTER_KEY
