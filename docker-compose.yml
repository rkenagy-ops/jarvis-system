# docker-compose for the jarvis-system support services.
# vllm + Kimi-K3 (the model brain) and Supabase are NOT included here because
# they typically need a GPU host or a hosted Supabase project; set those up
# separately and point LITELLM_BASE_URL / SUPABASE_URL in your .env at them.

version: "3.9"

services:
  # Optional extras. Super Jarvis does not need these to run.
  # Ports are loopback-only so `compose up` cannot punch fortress.
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml"]

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      - ASR_MODEL=base

  piper:
    image: rhasspy/wyoming-piper:latest
    ports:
      - "127.0.0.1:10200:10200"

  stirling:
    image: stirlingtools/stirling-pdf:latest
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  n8n_data:
